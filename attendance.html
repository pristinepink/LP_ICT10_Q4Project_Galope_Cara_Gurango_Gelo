<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍓 Attendance Tracker</h1>
    <nav>
      <ul>
        <li><a href="index.html">🌸 Home</a></li>
        <li><a href="classmates.html">🪽 Classmate List</a></li>
        <li><a href="attendance.html">🍓 Attendance Tracker</a></li>
        <li><a href="photos.html">🍥 Photo Gallery</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="tracker-box">
      <h2>Select Day</h2>
      <select>
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
      </select>
      <h2>Absences</h2>
      <input type="number" value="9">
      <button>Submit</button>
    </section>
    <section class="chart-box">
      <h2>Weekly Attendance (Absences)</h2>
      <img src="attendance_chart.png" alt="Attendance Chart" class="chart">
    </section>
  </main>
  <footer>
    <p>© 2025–2026 10-Quartz. All rights reserved.</p>
  </footer>
</body>
</html>
